<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K.O.C Collections | Products</title>
  <style>
    :root {
      --bg: #06070f;
      --text: #f5f5f7;
      --muted: #9fa2b8;
      --accent: #ff4d88;
      --border: rgba(255,255,255,0.10);
      --surface: rgba(255,255,255,0.06);
      --transition: 0.28s ease;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: #06070f;
    }
    a, button, input { font: inherit; }
    img { display: block; max-width: 100%; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 42px;
      background: rgba(10, 12, 18, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent), #ff7fba);
    }
    .brand-mark img { width:100%; height:100%; object-fit:cover; }
    .brand-copy h1 { margin:0; font-size:1.15rem; }
    .brand-copy p { margin:4px 0 0; color: var(--muted); font-size:0.75rem; }
    nav { display: flex; align-items: center; gap: 22px; }
    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.96rem;
      transition: color var(--transition);
    }
    nav a:hover { color: var(--accent); }
    .menu-toggle {
      display: none;
      font-size: 1.5rem;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
    }
    .catalog {
      max-width: 1180px;
      margin: 0 auto;
      padding: 60px 42px 80px;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: -0.04em;
    }
    .search-box {
      width: min(420px, 100%);
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      outline: none;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 26px;
    }
    .product {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
    }
    .product img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .product-details { padding: 20px; }
    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .product-header h3 {
      margin: 0;
      font-size: 1.1rem;
    }
    .price {
      color: var(--accent);
      font-weight: 700;
    }
    .original-price {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      text-decoration: line-through;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }
    @media (max-width: 830px) {
      header {
        padding: 18px 20px;
      }
      .menu-toggle { display: block; }
      nav {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        display: none;
        flex-direction: column;
        align-items: flex-start;
        background: rgba(10,12,18,0.98);
        padding: 18px 20px 10px;
        border-top: 1px solid var(--border);
      }
      nav.active { display: flex; }
      .catalog { padding: 42px 20px 64px; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="brand-mark"><img src="logo.jpg" alt="K.O.C logo" /></div>
      <div class="brand-copy">
        <h1>K.O.C</h1>
        <p>Collections</p>
      </div>
    </div>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle menu">☰</button>
    <nav id="nav-links">
      <a href="index.html">Home</a>
      <a href="About.html">About</a>
      <a href="products.html">Products</a>
    </nav>
  </header>

  <main class="catalog">
    <div class="page-head">
      <div>
        <p class="eyebrow">Collection</p>
        <h1>All Products</h1>
      </div>
      <input id="search-box" class="search-box" type="text" placeholder="Search products..." aria-label="Search products" />
    </div>
    <div id="product-grid" class="products"></div>
  </main>

  <script src="inventory.js"></script>
  <script>
    const inventory = loadKocInventory();
    const grid = document.getElementById('product-grid');
    const searchBox = document.getElementById('search-box');
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');

    function renderProducts(query = '') {
      const term = query.toLowerCase().trim();
      const items = inventory.filter(product => {
        const matches = !term || product.name.toLowerCase().includes(term) || product.category.toLowerCase().includes(term);
        return matches;
      });

      if (!items.length) {
        grid.innerHTML = '<p class="empty-state">No products match your search.</p>';
        return;
      }

      grid.innerHTML = items.map(product => `
        <article class="product">
          <img src="${escapeKocHtml(product.images[0])}" alt="${escapeKocHtml(product.name)}" />
          <div class="product-details">
            <div class="product-header">
              <h3>${escapeKocHtml(product.name)}</h3>
              <span class="price">ZMW${product.price}</span>
            </div>
            ${product.originalPrice ? `<span class="original-price">ZMW${product.originalPrice}</span>` : ''}
          </div>
        </article>
      `).join('');
    }

    searchBox.addEventListener('input', (event) => {
      renderProducts(event.target.value);
    });

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });

    renderProducts();
  </script>
</body>
</html>
