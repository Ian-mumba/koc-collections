<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.O.C Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
:root {
  --bg: #06070f;
  --surface: rgba(255,255,255,0.08);
  --text: #f5f5f7;
  --muted: #9fa2b8;
  --accent: #ff4d88;
  --border: rgba(255,255,255,0.18);
  --transition: 0.28s ease;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: var(--text);
  background: var(--bg);
  padding: 40px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 32px;
  padding: 36px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.22);
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 32px;
}
h1 {
  margin: 0;
  color: var(--accent);
  font-size: 1.9rem;
}
.form-group {
  margin-bottom: 22px;
}
label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
}
input, select, textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
}
input[type="file"] {
  padding: 10px;
}
button {
  background: linear-gradient(135deg, var(--accent), #ff7fba);
  color: white;
  border: none;
  padding: 16px 32px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  transition: var(--transition);
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(255,77,136,0.3);
}
#theme-toggle {
  background: rgba(255,255,255,0.08);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.16);
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 600;
}
#image-preview {
  margin-top: 10px;
  max-width: 220px;
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.15);
}
.success {
  color: #4ade80;
  margin-top: 20px;
  text-align: center;
}
body.light-theme {
  background: #eef2fb;
  color: #1f2340;
}
body.light-theme .container {
  background: #ffffff;
  border-color: rgba(31,35,64,0.08);
  box-shadow: 0 24px 80px rgba(31,35,64,0.08);
}
body.light-theme input,
body.light-theme select,
body.light-theme textarea {
  background: #fff;
  color: #1f2340;
  border-color: rgba(31,35,64,0.12);
}
body.light-theme button {
  box-shadow: none;
}
body.light-theme #theme-toggle {
  background: rgba(31,35,64,0.05);
  color: #1f2340;
  border-color: rgba(31,35,64,0.1);
}
</style>
</head>
<body>
<script>
  window.location.replace('/login');
</script>
<div class="container">
  <div class="top-bar">
    <h1><i class="fas fa-upload"></i> K.O.C Admin Portal</h1>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="theme-toggle" type="button">Light Mode</button>
      <button id="logout-btn" type="button" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; padding: 12px 20px; color: var(--text);">Log out</button>
    </div>
  </div>
  <form id="upload-form">
    <div class="form-group">
      <label for="product-name">Product Name</label>
      <input type="text" id="product-name" required>
    </div>
    <div class="form-group">
      <label for="product-price">Price (ZMW)</label>
      <input type="number" id="product-price" required>
    </div>
    <div class="form-group">
      <label for="original-price">Original Price (ZMW) - Optional</label>
      <input type="number" id="original-price">
    </div>
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" required>
        <option value="men">Men</option>
        <option value="women">Women</option>
        <option value="accessories">Accessories</option>
      </select>
    </div>
    <div class="form-group">
      <label for="product-image">Product Image</label>
      <input type="file" id="product-image" accept="image/*" required>
      <img id="image-preview" style="display: none;">
    </div>
    <button type="submit">Add Product</button>
  </form>
  <div id="success-message" class="success" style="display: none;">Product added successfully!</div>
</div>

<script>
document.getElementById('product-image').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('image-preview').src = e.target.result;
      document.getElementById('image-preview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

document.getElementById('upload-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const name = document.getElementById('product-name').value;
  const price = parseFloat(document.getElementById('product-price').value);
  const originalPrice = document.getElementById('original-price').value ? parseFloat(document.getElementById('original-price').value) : null;
  const category = document.getElementById('category').value;
  const imageFile = document.getElementById('product-image').files[0];

  if (!imageFile) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const imageData = e.target.result;

    // Load existing inventory
    let inventory = JSON.parse(localStorage.getItem('koc_inventory')) || [];

    // Add new product
    const newProduct = {
      id: Date.now(), // Simple ID generation
      name: name,
      price: price,
      originalPrice: originalPrice,
      images: [imageData], // Store base64
      category: category
    };

    inventory.push(newProduct);

    // Save to localStorage
    localStorage.setItem('koc_inventory', JSON.stringify(inventory));

    // Show success message
    document.getElementById('success-message').style.display = 'block';

    // Reset form
    document.getElementById('upload-form').reset();
    document.getElementById('image-preview').style.display = 'none';

    // Hide success message after 3 seconds
    setTimeout(() => {
      document.getElementById('success-message').style.display = 'none';
    }, 3000);
  };

  reader.readAsDataURL(imageFile);
});
const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('light-theme');
  themeToggle.textContent = document.body.classList.contains('light-theme') ? 'Dark Mode' : 'Light Mode';
});

const logoutBtn = document.getElementById('logout-btn');
logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('koc_admin_authorized');
  window.location.href = 'index.html';
});
</script>
</body>
</html>
