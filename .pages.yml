media:
  - name: product_images
    label: Product images
    input: product-images
    output: product-images
    extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: products
    label: Products
    type: file
    path: products.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: price
        type: number
        required: true
        options:
          min: 0
      - name: originalPrice
        label: Original price (optional)
        type: number
        required: false
        options:
          min: 0
      - name: category
        type: select
        required: true
        options:
          values: [men, women, accessories]
      - name: images
        type: image
        required: true
        options:
          media: product_images
          multiple:
            max: 6
          unique: true